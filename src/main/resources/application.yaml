spring:
  application:
    name: accounting

accounting:
  time-zone: America/Chicago

help:
  messages:
    transaction: "Tattoo/Jewelry: tattoo, price, tip, name?, date?"
    payout: "Payout: payout, amount, date?"
    expense: "Expense: expense, cost, reason?, date?"
    # query: "Query: query, queryType, args?"
    report: "Report: report, month, month?, year? OR report, year, year?"
    undo: "Undo: undo, entryType, entryId"

reporting:
  pdf:
    working-dir: generated/pdf
    timeout: 60s

templates:
  locations:
    monthly: classpath:/templates/monthly-pdf.latex.template
    yearly: classpath:/templates/yearly-pdf.latex.template
    month-section: classpath:/templates/month-section.latex.template
    revenue: classpath:/templates/revenue-row.latex.template
    expenses: classpath:/templates/expense-row.latex.template
    payouts: classpath:/templates/payout-row.latex.template
    totals: classpath:/templates/totals-row.latex.template
